apiVersion: v1
kind: PersistentVolume
metadata:
  labels:
    type: local
  name: spotme-mysql-pv-dev
spec:
  accessModes:
  - ReadWriteOnce
  capacity:
    storage: 5Gi
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    name: spotme-mysql-pvc-dev
    namespace: spotme-dev
  hostPath:
    path: /mnt/data-sm-dev
    type: ""
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  volumeMode: Filesystem