apiVersion: v1
kind: PersistentVolume
metadata:
  annotations:
  labels:
    type: local
  name: spotme-mysql-pv-test
spec:
  accessModes:
  - ReadWriteOnce
  capacity:
    storage: 6Gi
  hostPath:
    path: /mnt/data-sm-test
    type: ""
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  volumeMode: Filesystem
