piVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ${namespace}

commonLabels:
  # serviceGroup: spotme-rest
  project: spotme

resources:
  - ../../base
  - configmap.yml
  
images:
  - name: app-image
    newName: containerregistry.spot-me-app.com/spotme/spotme-rest
    newTag: "release"

patches:
- replicaset-patch.yml 
- service-patch.yml