apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ${namespace}

commonLabels:
  # serviceGroup: spotme-rest
  project: spotme

resources:
  - ../../base
  - configmap.yml
  - ingress.yml
  - load-balancer.yml
  
images:
  - name: app-image
    newName: ${image}
    # newTag: "develop"\

configMapGenerator:
  - name: ${parameters['appname']}-properties
    behavior: merge
    files:
      - application-k8s.yaml

patches:
- replicaset-patch.yml 
- service-patch.yml
