apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: ${appname}
  namespace: ${namespace}
  annotations:
    strategy.spinnaker.io/versioned: 'false'
    strategy.spinnaker.io/recreate: 'true'
  labels:
    app: ${appname}
    type: back-end
spec:
  template:
    metadata:
      name: ${appname}
      labels:
        app: ${appname}
        svc: ${appname}
        type: back-end
    spec:
      containers:
        - name: ${appname}
          imagePullPolicy: Always
          resources:
            requests:
              memory: "200Mi"
              cpu: "50m"
            limits:
              memory: "1000Mi"
              cpu: "250m"
      imagePullSecrets:
        - name: jfrog-dev